# This Yaml Document has been converted by ESAI Yaml Pipeline Conversion Tool.
# This pipeline will be extended to the OneESPT template
# CI and PR build script
#
# There should be no deep magic here. The developer experience and CI experience
# must remain as close to one another as possible.

trigger:
- master

variables:
# Debug/verbose output variables for CLI and mock server
- name: DEBUG_CLI_OUTPUT
  value: 'false'
- name: DEBUG_MOCKSERVER_OUTPUT
  value: 'false'
# Enable verbose tracing for TFX CLI (if supported)
- name: TFX_TRACE
  value: ''
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      skipBuildTagsForGitHubPullRequests: true
    # featureFlags:
      # autoBaseline: false
    # sdl:
    #   baseline:
    #     baselineSet: default
    #     baselineFile: $(Build.SourcesDirectory)/.gdn/.gdnbaselines
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-2022
        os: windows
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    stages:
    - stage: stage
      jobs:
      - job: job
        steps:
        - template: /.azure-pipelines/common-steps.yml@self

        - task: NodeTool@0
          displayName: Use node 20
          inputs:
            versionSpec: "20.x"

        # CFS [SFI-ES4.2.4]: every npm invocation below must resolve through the
        # repo .npmrc (internal Azure Artifacts feed). Without NPM_CONFIG_USERCONFIG
        # these global installs fall back to the default public registry.
        - script: npm i -g npm@10.2.4 --force
          displayName: Use npm version 10.2.4
          env:
            NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

        - script: npm i -g typescript@5.1.3 --force
          displayName: Use typescript (tsc) version 5.1.3
          env:
            NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc
        
        - task: Npm@1
          displayName: install TFX CLI dependencies
          inputs:
            command: ci
          env:
            NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc
        
        - bash: |
            npm run build
          displayName: Build TFX CLI
          env:
            NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

        - task: Npm@1
          displayName: Publish tfx-cli to kusto npm
          condition: and(succeeded(), in(variables['build.reason'], 'IndividualCI', 'BatchedCI', 'Manual'), eq(variables['build.sourcebranchname'], 'master'))
          inputs:
            command: publish
            workingDir: './'
            publishRegistry: useFeed
            publishFeed: tfs-cli
          continueOnError: true
        
        - bash: |
            npm pack
            cp *.tgz '$(Build.ArtifactStagingDirectory)'
          displayName: Run npm-pack and copy to ArtifactStagingDirectory
          env:
            NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

        # Install node 16 for CodeQL 3000
        - task: NodeTool@0
          displayName: Use node 16
          inputs:
            versionSpec: "16.x"
